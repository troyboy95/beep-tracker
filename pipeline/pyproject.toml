[project]
name = "beep-pipeline"
version = "0.1.0"
description = "Daily ingestion pipeline: fetch India fresher jobs, dedup, LLM-tag, upsert to Postgres"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "psycopg[binary]>=3.2",
  "google-genai>=1.0",
  "tenacity>=8.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "respx>=0.21"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["beep*"]

[tool.setuptools.package-data]
beep = ["sources/*.toml"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
