name: pipeline

# Full refresh once a day + tag-queue drains through the day (free-tier LLM limits).
# Both modes live in ONE workflow sharing ONE concurrency group, so two pipeline runs can
# never overlap (no double-tagging / duplicate ledger rows), and no DB row locks are needed.
on:
  schedule:
    - cron: "30 2 * * *"              # full: 08:00 IST
    - cron: "45 6,10,14,18,22 * * *"  # tag_only: every ~4 h
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        type: choice
        options: [full, tag_only]
        default: full

concurrency:
  group: beep-pipeline
  # Never cancel a running pipeline mid-write; a newer trigger waits. GitHub keeps at most one
  # pending run per group; a superseded pending drain is harmless (the queue persists in the DB).
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MODE: >-
        ${{ github.event_name == 'workflow_dispatch' && inputs.mode
            || (github.event.schedule == '30 2 * * *' && 'full' || 'tag_only') }}
      TRIGGER: ${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}
      # secrets
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
      # non-secret config (repo Variables); unset ones fall back to code defaults
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      GEMINI_PRICE_INPUT_PER_M: ${{ vars.GEMINI_PRICE_INPUT_PER_M }}
      GEMINI_PRICE_OUTPUT_PER_M: ${{ vars.GEMINI_PRICE_OUTPUT_PER_M }}
      HTTP_USER_AGENT: ${{ vars.HTTP_USER_AGENT }}
      REVALIDATE_URL: ${{ vars.REVALIDATE_URL }}
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml

      - name: Install
        run: pip install -e .

      - name: Migrate
        if: env.MODE == 'full'
        run: python -m beep.migrate

      - name: Full refresh
        if: env.MODE == 'full'
        run: python -m beep.run --trigger "$TRIGGER"

      - name: Drain tag queue
        if: env.MODE == 'tag_only'
        run: python -m beep.run --tag-only --trigger "$TRIGGER"
